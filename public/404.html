<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Vishal Soni</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a2540" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      @font-face {
        font-family: 'Chakra Petch';
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/chakra-petch-700-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
      }
      :root {
        --bg: #0a2540;
        --ink: #e6f1ff;
        --muted: #8fb0d4;
        --line: #244a73;
        --cyan: #7fd8ff;
        --orange: #ffb347;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(127, 216, 255, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 216, 255, 0.09) 1px, transparent 1px),
          linear-gradient(rgba(127, 216, 255, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(127, 216, 255, 0.04) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px;
        color: var(--ink);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
      }
      main {
        width: min(560px, 100%);
        padding: 40px 32px;
        border: 1px solid var(--line);
        background: rgba(10, 37, 64, 0.85);
      }
      .label {
        color: var(--orange);
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 16px 0 12px;
        font-family: 'Chakra Petch', system-ui, sans-serif;
        font-size: clamp(48px, 12vw, 88px);
        line-height: 0.95;
        text-transform: uppercase;
      }
      h1 span {
        color: var(--cyan);
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 22px;
        background: var(--cyan);
        color: var(--bg);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-decoration: none;
      }
      a:hover {
        background: #c8efff;
      }
      a:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">ERROR 404 · SHEET NOT FOUND</p>
      <h1>Off the <span>grid.</span></h1>
      <p>There's no drawing at this address. The portfolio is a single sheet; everything is on the home page.</p>
      <a href="/">BACK TO THE PORTFOLIO →</a>
    </main>
  </body>
</html>

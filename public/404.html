<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Vishal Soni</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a2540" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2efe6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <style>
      @font-face {
        font-family: 'Chakra Petch';
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/chakra-petch-700-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
      }
      /* Same tokens as src/styles/tokens.css: blueprint by default, vellum on light devices */
      :root {
        color-scheme: dark;
        --bg: #0a2540;
        --ink: #e6f1ff;
        --muted: #8fb0d4;
        --line: #244a73;
        --cyan: #7fd8ff;
        --orange: #ffb347;
        --btn-bg: #7fd8ff;
        --btn-ink: #0a2540;
        --btn-hover: #c8efff;
        --card: rgba(10, 37, 64, 0.85);
        --grid-major: rgba(127, 216, 255, 0.09);
        --grid-minor: rgba(127, 216, 255, 0.04);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #f2efe6;
          --ink: #1d2733;
          --muted: #5b6470;
          --line: #d9d3c3;
          --cyan: #1f5aa6;
          --orange: #a3560f;
          --btn-bg: #1d2733;
          --btn-ink: #f7f5ef;
          --btn-hover: #1f5aa6;
          --card: rgba(250, 248, 242, 0.9);
          --grid-major: rgba(31, 90, 166, 0.1);
          --grid-minor: rgba(31, 90, 166, 0.045);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background-color: var(--bg);
        background-image:
          linear-gradient(var(--grid-major) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
          linear-gradient(var(--grid-minor) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 16px 16px, 16px 16px;
        color: var(--ink);
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
      }
      main {
        width: min(560px, 100%);
        padding: 40px 32px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      .label {
        color: var(--orange);
        font-size: 12px;
        letter-spacing: 0.12em;
      }
      h1 {
        margin: 16px 0 12px;
        font-family: 'Chakra Petch', system-ui, sans-serif;
        font-size: clamp(48px, 12vw, 88px);
        line-height: 0.95;
        text-transform: uppercase;
      }
      h1 span {
        color: var(--cyan);
      }
      p {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 22px;
        background: var(--btn-bg);
        color: var(--btn-ink);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-decoration: none;
      }
      a:hover {
        background: var(--btn-hover);
      }
      a:focus-visible {
        outline: 2px solid var(--orange);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">ERROR 404 · SHEET NOT FOUND</p>
      <h1>Off the <span>grid.</span></h1>
      <p>There's no drawing at this address. The portfolio is a single sheet; everything is on the home page.</p>
      <a href="/">BACK TO THE PORTFOLIO →</a>
    </main>
  </body>
</html>
